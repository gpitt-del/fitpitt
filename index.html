<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FitPitt</title>
<meta name="description" content="Training plans and a workout log.">
<meta name="theme-color" content="#ECEFF2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121922" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FitPitt">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" id="ati" href="icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app"></div>
<div id="rest" hidden>
  <div class="rest-fill" id="restfill"></div>
  <div class="rest-row"><span class="rest-label" id="restlabel">Rest</span><span class="rest-time" id="resttime" aria-live="off">0:00</span><button data-act="restAdd">Add 30 s</button><button data-act="restSkip">Skip</button></div>
</div>
<nav id="tabs" aria-label="Sections"><div>
  <button data-act="tab" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 9.5v5M6.5 6v12M17.5 6v12M21 9.5v5M6.5 12h11"/></svg><span>Today</span></button>
  <button data-act="tab" data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="1.5"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span>Plan</span></button>
  <button data-act="tab" data-tab="body"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 12l3.5-3.5M12 3.5v2M3.5 12h2M18.5 12h2"/></svg><span>Body</span></button>
  <button data-act="tab" data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5v14h16M8 15l3-4 3 2 4-6"/></svg><span>Progress</span></button>
  <button data-act="tab" data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h8M18 7h2M4 12h2M12 12h8M4 17h9M19 17h1"/><circle cx="15" cy="7" r="2.3"/><circle cx="9" cy="12" r="2.3"/><circle cx="16" cy="17" r="2.3"/></svg><span>Settings</span></button>
</div></nav>
<div id="sheet" hidden><button class="sheet-back" data-act="closeSheet" aria-label="Close"></button><div class="sheet-body" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status" hidden></div>
<script>const STANDALONE = true;</script>
<script src="a.js"></script>
<script src="b.js"></script>
<script src="c.js"></script>
<script src="d.js"></script>
<script src="e.js"></script>
<script src="f.js"></script>
<script src="g.js"></script>
<script src="h.js"></script>
<script src="i.js"></script>
<script src="j.js"></script>
<script src="k.js"></script>
</body>
</html>
